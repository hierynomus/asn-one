plugins {
  id "java"
  id "jacoco"
  id "maven-publish"
  id "signing"
  id 'pl.allegro.tech.build.axion-release' version '1.21.2'
  id "com.github.hierynomus.license" version "0.16.1"
  id 'ru.vyarus.github-info' version '2.0.0'
  id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
  id "biz.aQute.bnd.builder" version "7.3.0"
}

repositories {
  mavenCentral()
}

group = "com.hierynomus"
defaultTasks "build"

ext {
  moduleName = "${project.group}.${project.name.replaceAll("-", "")}"
}

compileJava {
  // Keep producing Java 7 bytecode; --release also verifies we only use the Java 7 API.
  options.release = 7
}

compileTestJava {
  options.release = 17
}

configurations.implementation.transitive = false

dependencies {
  implementation "org.slf4j:slf4j-api:1.7.36"
  testImplementation platform('org.junit:junit-bom:6.1.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'ch.qos.logback:logback-classic:1.2.13'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

license {
  header = project.file("HEADER")
  mapping {
    java = 'SLASHSTAR_STYLE'
  }
  strictCheck = true
}

scmVersion {
  tag {
    prefix = 'v'
    versionSeparator = ''
  }
  hooks {
    pre 'fileUpdate', [file: 'README.adoc', pattern: { v, c -> /:asn_version: .*/}, replacement: { v, c -> ":asn_version: $v" }]
    pre 'commit'
  }
}

project.version = scmVersion.version

// Explicit module descriptor, packaged as a multi-release jar entry so the main code stays Java 7 compatible.
sourceSets {
  java9 {
    java {
      srcDirs = ['src/main/java9']
    }
  }
}

tasks.named('compileJava9Java', JavaCompile) {
  options.release = 9
  classpath = configurations.compileClasspath
  options.compilerArgs += ['--patch-module', "${project.moduleName}=${sourceSets.main.java.classesDirectory.get().asFile}"]
  dependsOn compileJava
}

java {
	withJavadocJar()
	withSourcesJar()
}

jar {
  into('META-INF/versions/9') {
    from sourceSets.java9.output
  }
  manifest {
    attributes 'Multi-Release': 'true'
  }
  // Add minimal OSGi metadata.
  // We are using slf4j as a client, so can use also 2.x API.
  bundle {
    bnd '''
Bundle-SymbolicName: ${project.group}.${project.name}
Import-Package: org.slf4j;version="[1.7,3)", *
-exportcontents: *
-noextraheaders: true
'''
  }
}

// This disables the pedantic doclint feature of JDK8
if (JavaVersion.current().isJava8Compatible()) {
  tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
  }
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  include "**/*Test.*"
  def testLogger = logger
  addTestListener(new TestListener() {
    void beforeSuite(TestDescriptor suite) {}
    void beforeTest(TestDescriptor test) {}
    void afterTest(TestDescriptor test, TestResult result) {}
    void afterSuite(TestDescriptor suite, TestResult result) {
      def indicator = "\u001B[32m✓\u001b[0m"
      if (result.failedTestCount > 0) {
        indicator = "\u001B[31m✘\u001b[0m"
      }
      testLogger.lifecycle("$indicator Test ${suite.name}; Executed: ${result.testCount}/\u001B[32m${result.successfulTestCount}\u001B[0m/\u001B[31m${result.failedTestCount}\u001B[0m")
    }
  })
}

github {
  user = 'hierynomus'
  license = 'Apache'
}

publishing {
	publications {
		maven(MavenPublication) {
			from(components.java)
		}
	}
}

project.signing {
  required = { project.gradle.taskGraph.hasTask("release") }
	sign publishing.publications.maven

  if (project.hasProperty("signingKeyId") || project.hasProperty("signingKey")) {
		def signingKeyId = project.findProperty("signingKeyId")
		def signingKey = project.findProperty("signingKey")
		def signingPassword = project.findProperty("signingPassword")
		if (signingKeyId) {
			useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
		} else if (signingKey) {
			useInMemoryPgpKeys(signingKey, signingPassword)
		}
	}
}

project.plugins.withType(MavenPublishPlugin).all {
	PublishingExtension publishing = project.extensions.getByType(PublishingExtension)
	publishing.publications.withType(MavenPublication).all { mavenPublication ->
		mavenPublication.pom {
			name = "${project.name}"
      description = 'ASN.1 serialization and parsing library'
      url = "https://github.com/hierynomus/${project.name}"
			licenses {
				license {
					name = "The Apache License, Version 2.0"
					url = "https://www.apache.org/licenses/LICENSE-2.0"
				}
			}
			developers {
				developer {
					id = "hierynomus"
					name = "Jeroen van Erp"
					email = "jeroen@hierynomus.com"
				}
			}
      scm {
        url = "https://github.com/hierynomus/${project.name}"
        connection = "scm:git@github.com:hierynomus/${project.name}.git"
        developerConnection = "scm:git@github.com:hierynomus/${project.name}.git"
      }
		}
	}
}

nexusPublishing {
	repositories {
		sonatype()    //sonatypeUsername and sonatypePassword properties are used automatically
	}

	connectTimeout = Duration.ofMinutes(3)
	clientTimeout = Duration.ofMinutes(3)
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

project.tasks.release.dependsOn([project.tasks.build])

project.tasks.jacocoTestReport.dependsOn(project.tasks.test)
project.tasks.check.dependsOn(project.tasks.jacocoTestReport)
